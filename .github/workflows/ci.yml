---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    name: Pre-commit checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - uses: esphome/pre-commit-action@43cd1109c09c544d97196f7730ee5b2e0cc6d81e # v3.0.1 fork with pinned actions/cache

  lint:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy libavahi-compat-libdnssd-dev

      - name: Run clang-tidy
        run: ./script/clang-tidy.sh

  build:
    name: Build
    runs-on: ubuntu-latest
    # The host CMake build compiles through ccache once it is installed. Every host job restores
    # its newest cache, but only pushes to main save one, so PR runs reuse main's objects without
    # filling the repository's cache quota.
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 300M
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache libavahi-compat-libdnssd-dev

      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-build-${{ github.sha }}
          restore-keys: ccache-build-

      - name: Configure CMake
        run: cmake -B build -DENABLE_WERROR=ON .

      - name: Build
        run: |
          ccache --zero-stats
          cmake --build build
          ccache --show-stats

      - name: Save ccache
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-build-${{ github.sha }}

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 300M
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache libavahi-compat-libdnssd-dev

      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-test-${{ github.sha }}
          restore-keys: ccache-test-

      - name: Configure CMake
        # BUILD_EXAMPLES=OFF so the test job configures only sendspin + tests and skips the
        # example-only FetchContent deps (e.g. FTXUI).
        run: cmake -B build-tests -DENABLE_WERROR=ON -DSENDSPIN_BUILD_TESTS=ON -DENABLE_SANITIZERS=ON -DBUILD_EXAMPLES=OFF .

      - name: Build tests
        run: |
          ccache --zero-stats
          cmake --build build-tests --target sendspin_tests
          ccache --show-stats

      - name: Save ccache
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-test-${{ github.sha }}

      - name: Run tests
        run: ctest --test-dir build-tests --output-on-failure

  test-no-opus:
    name: Build and test without Opus
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 300M
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache libavahi-compat-libdnssd-dev

      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-test-no-opus-${{ github.sha }}
          restore-keys: ccache-test-no-opus-

      - name: Configure CMake
        # SENDSPIN_ENABLE_OPUS=OFF must build the library, the examples, and the tests without
        # micro-opus. The player and source tests whose results differ in this configuration run
        # under ASan/UBSan here, like the default suite does in the test job.
        run: cmake -B build-no-opus -DENABLE_WERROR=ON -DSENDSPIN_ENABLE_OPUS=OFF -DSENDSPIN_BUILD_TESTS=ON -DENABLE_SANITIZERS=ON .

      - name: Build
        run: |
          ccache --zero-stats
          cmake --build build-no-opus
          ccache --show-stats

      - name: Save ccache
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-test-no-opus-${{ github.sha }}

      - name: Run tests
        run: ctest --test-dir build-no-opus --output-on-failure

  test-tsan:
    name: Unit tests (ThreadSanitizer)
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 300M
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache libavahi-compat-libdnssd-dev

      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-test-tsan-${{ github.sha }}
          restore-keys: ccache-test-tsan-

      - name: Configure CMake
        # ENABLE_TSAN instead of ENABLE_SANITIZERS: TSan cannot be combined with ASan/UBSan, and
        # the concurrency tests only report a data race when built this way.
        run: cmake -B build-tsan -DENABLE_WERROR=ON -DSENDSPIN_BUILD_TESTS=ON -DENABLE_TSAN=ON -DBUILD_EXAMPLES=OFF .

      - name: Build tests
        run: |
          ccache --zero-stats
          cmake --build build-tsan --target sendspin_tests
          ccache --show-stats

      - name: Save ccache
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-test-tsan-${{ github.sha }}

      - name: Reduce mmap randomization
        # TSan aborts at startup with "unexpected memory mapping" under the 32-bit mmap
        # randomization the runner kernel defaults to.
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Run tests
        # halt_on_error makes a detected race fail the job deterministically rather than relying
        # on the process happening to abort afterwards.
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build-tsan --output-on-failure

  esp-idf:
    name: ESP-IDF ${{ matrix.idf }} build (${{ matrix.config.name }})
    runs-on: ubuntu-latest
    container: espressif/idf:${{ matrix.idf }}
    strategy:
      fail-fast: false
      matrix:
        # v5.5.2 is the minimum declared in idf_component.yml
        idf: [v5.5.2, v5.5.5, v6.0.3]
        config:
          - name: default
            sdkconfig_defaults: sdkconfig.defaults
            flac: 'on'
            opus: 'on'
          - name: no-opus
            sdkconfig_defaults: sdkconfig.defaults;sdkconfig.no_opus
            flac: 'on'
            opus: 'off'
          # Player off: micro-opus comes in for the source's encoder alone
          - name: source-only
            sdkconfig_defaults: sdkconfig.defaults;sdkconfig.source_only
            flac: 'off'
            opus: 'on'
    defaults:
      run:
        shell: bash
        working-directory: tests/esp_idf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        run: |
          . "$IDF_PATH/export.sh" > /dev/null
          idf.py -D SDKCONFIG_DEFAULTS="${{ matrix.config.sdkconfig_defaults }}" build

      - name: Check codec dependencies
        run: |
          . "$IDF_PATH/export.sh" > /dev/null
          python check_build.py --flac ${{ matrix.config.flac }} --opus ${{ matrix.config.opus }}

  ci:
    name: CI
    needs: [pre-commit, lint, build, test, test-no-opus, test-tsan, esp-idf]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify all jobs passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more jobs failed or were cancelled"
            exit 1
          fi
